<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Что рядом</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="page">

  <header class="head">
    <h1>Что рядом</h1>
    <p id="hint" class="sub">Загружаю…</p>
  </header>

  <!-- Одна форма на вход и регистрацию: поля почти те же, а два отдельных экрана
       на четыре поля — лишняя навигация. Вход через Telegram сохранён
       в ветке telegram-auth. -->
  <section class="card" id="auth-card" hidden>
    <h2 class="quiet" id="auth-title">Вход</h2>

    <form id="auth-form" class="auth-form">
      <label class="field">
        <span>Логин</span>
        <input id="auth-login" type="text" autocomplete="username" required>
      </label>

      <label class="field">
        <span>Пароль</span>
        <input id="auth-password" type="password" autocomplete="current-password" required>
      </label>

      <label class="field" id="auth-name-field" hidden>
        <span>Как вас показывать</span>
        <input id="auth-name" type="text" autocomplete="nickname">
      </label>

      <div class="row">
        <button type="submit" class="primary" id="auth-submit">Войти</button>
        <button type="button" class="linky" id="auth-toggle">Зарегистрироваться</button>
      </div>
    </form>

    <p id="auth-note" class="note" role="status" hidden></p>
  </section>

  <section class="card me" id="me-card" hidden>
    <div class="me-text">
      <strong id="me-name"></strong>
    </div>
    <button id="logout" class="linky">выйти</button>
  </section>

  <div class="tabs" role="tablist" id="tabs" hidden>
    <button id="tab-search-btn" class="tab" role="tab" aria-controls="tab-search">Поиск мест</button>
    <button id="tab-feed-btn" class="tab" role="tab" aria-controls="tab-feed">Мои отметки</button>
    <button id="tab-map-btn" class="tab" role="tab" aria-controls="tab-map">Карта</button>
  </div>

  <!-- Сообщения выше вкладок: ошибка поиска и ошибка загрузки отметок
       должны быть видны, на какой бы вкладке человек ни находился. -->
  <p id="note" class="note" role="status" hidden></p>

  <div id="tab-search" role="tabpanel" aria-labelledby="tab-search-btn">
    <section class="card">
      <div id="categories" class="chips" role="group" aria-label="Категории мест"></div>

      <div class="row">
        <button id="search" class="primary">Найти рядом</button>
      </div>
    </section>

    <!-- Данные OpenStreetMap отделены рамкой: рядом с ними должна быть видна строка авторства. -->
    <section class="card source" id="results" hidden>
      <div id="places" class="places"></div>
      <p class="attribution">Данные о местах — © участники OpenStreetMap</p>
    </section>
  </div>

  <div id="tab-feed" role="tabpanel" aria-labelledby="tab-feed-btn" hidden>
    <section class="card">
      <div id="feed" class="feed"></div>
    </section>
  </div>

  <!-- Карта общая: на ней отметки всех пользователей. Контейнер пустой —
       карту рисует SDK Яндекса, который подгружается при первом открытии вкладки. -->
  <div id="tab-map" role="tabpanel" aria-labelledby="tab-map-btn" hidden>
    <section class="card">
      <p id="map-note" class="note" role="status" hidden></p>
      <p id="map-empty" class="empty" hidden>Пока никто нигде не отметился.</p>
      <div id="map" class="map"></div>
    </section>
  </div>

</main>
<script src="/app.js"></script>
</body>
</html>
